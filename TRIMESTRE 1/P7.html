
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de soporte técnico</title>
</head>
<body>

    <h1>Solicitud de soporte técnico</h1>
    <p>Rellena el siguiente formulario para registrar una incidencia informática.</p>

    <form action="#" method="post">

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>
        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono">
        <br><br>

        <label for="equipo">Tipo de equipo:</label>
        <select id="equipo" name="equipo" required>
            <option value="">Selecciona una opción</option>
            <option value="ordenador">Ordenador</option>
            <option value="impresora">Impresora</option>
            <option value="red">Conexión de red</option>
            <option value="software">Software</option>
            <option value="otro">Otro</option>
        </select>
        <br><br>

        <label for="prioridad">Prioridad de la incidencia:</label>
        <select id="prioridad" name="prioridad" required>
            <option value="">Selecciona la prioridad</option>
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
        </select>
        <br><br>

        <label for="incidencia">Descripción de la incidencia:</label>
        <br>
        <textarea id="incidencia" name="incidencia"
                  rows="5" cols="40" required></textarea>
        <br><br>

        <label for="fecha">Fecha de la incidencia:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br><br>

        <button type="submit">Enviar solicitud</button>
        <button type="reset">Borrar formulario</button>

    </form>

</body>
</html>
